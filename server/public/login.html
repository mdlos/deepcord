<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DeepCord</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            padding: 20px;
        }
        
        .login-container {
            width: 100%;
            max-width: 440px;
        }
        
        .login-box {
            background: rgba(30, 30, 50, 0.85);
            backdrop-filter: blur(20px);
            padding: 40px 32px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .login-header .logo {
            font-size: 48px;
            margin-bottom: 12px;
        }
        
        .login-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #e0e0e0;
        }
        
        .login-header .subtitle {
            font-size: 14px;
            color: #888;
            margin-top: 4px;
        }
        
        .login-header .credits {
            margin-top: 12px;
            padding: 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .login-header .credits p {
            font-size: 12px;
            color: #666;
            line-height: 1.6;
        }
        
        .login-header .credits .highlight {
            color: #4facfe;
        }
        
        .login-header .credits .highlight2 {
            color: #fbbf24;
        }
        
        .form-group {
            margin-bottom: 18px;
        }
        
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #888;
            margin-bottom: 6px;
        }
        
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: #e0e0e0;
            font-size: 15px;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #4facfe;
            background: rgba(79, 172, 254, 0.08);
            box-shadow: 0 0 0 4px rgba(79, 172, 254, 0.1);
        }
        
        .form-group input::placeholder {
            color: #555;
        }
        
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .form-options label {
            color: #888;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .form-options label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #4facfe;
            cursor: pointer;
        }
        
        .form-options a {
            color: #4facfe;
            text-decoration: none;
            font-size: 14px;
        }
        
        .form-options a:hover {
            text-decoration: underline;
        }
        
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(79, 172, 254, 0.3);
        }
        
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }
        
        .register-link a {
            color: #4facfe;
            text-decoration: none;
            font-weight: 500;
        }
        
        .register-link a:hover {
            text-decoration: underline;
        }
        
        .message {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }
        
        .message.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        
        .message.error {
            background: rgba(248, 113, 113, 0.12);
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.15);
        }
        
        .message.success {
            background: rgba(74, 222, 128, 0.12);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.15);
        }
        
        .message.info {
            background: rgba(79, 172, 254, 0.12);
            color: #4facfe;
            border: 1px solid rgba(79, 172, 254, 0.15);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .server-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 12px;
            color: #555;
            margin-top: 16px;
            padding: 8px 16px;
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
        }
        
        .server-info .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }
        
        .server-info .dot.online {
            background: #4ade80;
        }
        
        .server-info .dot.offline {
            background: #f87171;
        }
        
        @media (max-width: 480px) {
            .login-box { padding: 28px 20px; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="logo">💬</div>
                <h1>DeepCord</h1>
                <div class="subtitle">Comunicação em tempo real</div>
                <div class="credits">
                    <p>
                        Sistema desenvolvido para disciplina <span class="highlight">Engenharia de Software</span>
                    </p>
                </div>
            </div>
            
            <div id="message" class="message"></div>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Usuário</label>
                    <input type="text" id="username" placeholder="Digite seu usuário" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="Digite sua senha" required>
                </div>
                <div class="form-options">
                    <label>
                        <input type="checkbox" id="remember"> Lembrar-me
                    </label>
                    <a href="#" id="forgot-link">Esqueceu a senha?</a>
                </div>
                <button type="submit" class="btn-login" id="login-btn">Entrar</button>
            </form>
            
            <div class="register-link">
                Não tem conta? <a href="#" id="register-link">Registre-se</a>
            </div>
            
            <div class="server-info">
                <span class="dot online" id="server-dot"></span>
                <span id="server-status">Conectado ao servidor</span>
            </div>
        </div>
    </div>

    <script>
        const serverHost = new URLSearchParams(window.location.search).get('host') || window.location.hostname || 'localhost';
        const serverPort = new URLSearchParams(window.location.search).get('port') || '8081';
        const baseUrl = `http://${serverHost}:${serverPort}`;

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message show ${type}`;
            setTimeout(() => { msg.classList.remove('show'); }, 5000);
        }

        // Verificar status do servidor
        async function checkServer() {
            try {
                const response = await fetch(`${baseUrl}/api/status`);
                if (response.ok) {
                    document.getElementById('server-dot').className = 'dot online';
                    document.getElementById('server-status').textContent = '🟢 Conectado ao servidor';
                } else {
                    document.getElementById('server-dot').className = 'dot offline';
                    document.getElementById('server-status').textContent = '🔴 Servidor offline';
                }
            } catch {
                document.getElementById('server-dot').className = 'dot offline';
                document.getElementById('server-status').textContent = '🔴 Servidor offline';
            }
        }
        checkServer();
        setInterval(checkServer, 10000);

        // Login
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;

            if (!username || !password) {
                showMessage('Preencha todos os campos', 'error');
                return;
            }

            const btn = document.getElementById('login-btn');
            btn.innerHTML = '<span class="loading-spinner"></span> Entrando...';
            btn.disabled = true;

            try {
                const response = await fetch(`${baseUrl}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
                });
                const data = await response.json();

                if (data.success) {
                    showMessage('Login realizado!', 'success');
                    setTimeout(() => {
                        window.location.href = `/chat?username=${encodeURIComponent(username)}&host=${serverHost}&port=${serverPort}`;
                    }, 500);
                } else {
                    showMessage(data.message || 'Credenciais inválidas', 'error');
                }
            } catch (error) {
                showMessage('Erro ao conectar ao servidor', 'error');
            }

            btn.innerHTML = 'Entrar';
            btn.disabled = false;
        });

        document.getElementById('register-link').addEventListener('click', function(e) {
            e.preventDefault();
            window.location.href = `/login?register=true&host=${serverHost}&port=${serverPort}`;
        });

        // Se for registro
        if (new URLSearchParams(window.location.search).get('register') === 'true') {
            document.getElementById('login-form').innerHTML = `
                <div class="form-group"><label>Usuário</label><input type="text" id="reg-username" placeholder="Escolha um usuário" required></div>
                <div class="form-group"><label>Email</label><input type="email" id="reg-email" placeholder="Digite seu email"></div>
                <div class="form-group"><label>Senha</label><input type="password" id="reg-password" placeholder="Crie uma senha" required></div>
                <button type="submit" class="btn-login" id="register-btn">Registrar</button>
            `;
            document.querySelector('.register-link').innerHTML = 'Já tem conta? <a href="#" id="login-link">Faça login</a>';

            document.getElementById('register-btn').addEventListener('click', async function(e) {
                e.preventDefault();
                const username = document.getElementById('reg-username').value.trim();
                const email = document.getElementById('reg-email').value.trim();
                const password = document.getElementById('reg-password').value;

                if (!username || !password) {
                    showMessage('Preencha todos os campos obrigatórios', 'error');
                    return;
                }

                if (username.length < 3) {
                    showMessage('Usuário mínimo 3 caracteres', 'error');
                    return;
                }

                if (password.length < 6) {
                    showMessage('Senha mínimo 6 caracteres', 'error');
                    return;
                }

                try {
                    const response = await fetch(`${baseUrl}/api/register`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}&email=${encodeURIComponent(email)}`
                    });
                    const data = await response.json();

                    if (data.success) {
                        showMessage('Registro realizado! Faça login.', 'success');
                        setTimeout(() => {
                            document.getElementById('login-link').click();
                        }, 1000);
                    } else {
                        showMessage(data.message || 'Erro no registro', 'error');
                    }
                } catch (error) {
                    showMessage('Erro ao conectar ao servidor', 'error');
                }
            });

            document.getElementById('login-link').addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = `/login?host=${serverHost}&port=${serverPort}`;
            });
        }
    </script>
</body>
</html>
