<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepCord - Login</title>

<link rel="stylesheet" href="login.css">
</head>
<body class="login-page">
<button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Alternar tema">🌙</button>

<div class="login-container">
    <div class="login-box">
        <div class="login-brand">
            <div class="logo">💬</div>
            <h1>DeepCord</h1>
            <p class="subtitle">Comunicação e estudo em tempo real</p>
        </div>

        <div class="message" id="message"></div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Usuário</label>
                <div class="input-wrap">
                    <span class="input-icon">👤</span>
                    <input type="text" id="username" placeholder="Digite seu usuário" required autofocus autocomplete="username">
                </div>
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <div class="input-wrap">
                    <span class="input-icon">🔑</span>
                    <input type="password" id="password" placeholder="Digite sua senha" required autocomplete="current-password">
                    <button type="button" class="toggle-pwd" onclick="togglePassword()" id="toggle-pwd">👁️</button>
                </div>
            </div>

            <div class="form-options">
                <label>
                    <input type="checkbox" id="remember"> Lembrar-me
                </label>
                <a href="#" onclick="forgotPassword(event)">Esqueceu a senha?</a>
            </div>

            <button type="submit" class="btn-primary" id="login-btn">
                Entrar
            </button>
        </form>

        <div class="login-footer">
            Não tem conta? <a href="#" onclick="showRegister(event)">Registre-se</a>
        </div>

        <div class="server-status">
            <span class="dot" id="server-dot"></span>
            <span id="server-status">Verificando servidor...</span>
        </div>
    </div>
</div>

<script>
// ============================================
// CONFIG
// ============================================
const host = window.location.hostname;
const port = '8081';
const baseUrl = `http://${host}:${port}`;

// ============================================
// TEMA
// ============================================
let currentTheme = localStorage.getItem('chat_theme') || 'light';
applyTheme(currentTheme);

function applyTheme(theme) {
    currentTheme = theme;
    document.body.classList.toggle('dark-theme', theme === 'dark');
    document.getElementById('theme-toggle').textContent = theme === 'dark' ? '☀️' : '🌙';
    localStorage.setItem('chat_theme', theme);
}
function toggleTheme() { applyTheme(currentTheme === 'dark' ? 'light' : 'dark'); }

// ============================================
// MENSAGENS
// ============================================
function showMessage(text, type) {
    const m = document.getElementById('message');
    m.className = `message show ${type}`;
    m.textContent = text;
    setTimeout(() => m.classList.remove('show'), 5000);
}

// ============================================
// VERIFICAR SERVIDOR
// ============================================
async function checkServer() {
    try {
        const r = await fetch(`${baseUrl}/api/status`, { cache: 'no-store' });
        const dot = document.getElementById('server-dot');
        const txt = document.getElementById('server-status');
        if (r.ok) {
            dot.classList.remove('offline');
            txt.textContent = 'Servidor online';
        } else {
            dot.classList.add('offline');
            txt.textContent = 'Servidor indisponível';
        }
    } catch {
        document.getElementById('server-dot').classList.add('offline');
        document.getElementById('server-status').textContent = 'Servidor indisponível';
    }
}
checkServer();
setInterval(checkServer, 15000);

// ============================================
// MOSTRAR/ESCONDER SENHA
// ============================================
function togglePassword() {
    const pwd = document.getElementById('password');
    const btn = document.getElementById('toggle-pwd');
    if (pwd.type === 'password') {
        pwd.type = 'text';
        btn.textContent = '🙈';
    } else {
        pwd.type = 'password';
        btn.textContent = '👁️';
    }
}

// ============================================
// LOGIN
// ============================================
async function handleLogin(e) {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const remember = document.getElementById('remember').checked;

    if (!username || !password) {
        showMessage('Preencha todos os campos', 'error');
        return;
    }

    const btn = document.getElementById('login-btn');
    const original = btn.innerHTML;
    btn.innerHTML = '<span class="spinner"></span> Entrando...';
    btn.disabled = true;

    try {
        const response = await fetch(`${baseUrl}/api/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
        });
        const data = await response.json();

        if (data.success) {
            showMessage('Login realizado! Redirecionando...', 'success');
            localStorage.setItem('last_username', username);
            if (remember) {
                localStorage.setItem('remember_user', username);
            } else {
                localStorage.removeItem('remember_user');
            }
            setTimeout(() => {
                window.location.href = `/?username=${encodeURIComponent(username)}`;
            }, 500);
        } else {
            showMessage(data.message || 'Credenciais inválidas', 'error');
            btn.innerHTML = original;
            btn.disabled = false;
        }
    } catch (err) {
        console.error(err);
        showMessage('Erro ao conectar. Verifique o servidor.', 'error');
        btn.innerHTML = original;
        btn.disabled = false;
    }
}

// ============================================
// REGISTRO
// ============================================
function showRegister(e) {
    if (e) e.preventDefault();

    const container = document.querySelector('.login-box');
    container.innerHTML = `
        <div class="login-brand">
            <div class="logo">💬</div>
            <h1>Criar Conta</h1>
            <p class="subtitle">Cadastre-se no DeepCord</p>
        </div>
        <div class="message" id="message"></div>
        <form id="register-form" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="reg-username">Usuário</label>
                <div class="input-wrap">
                    <span class="input-icon">👤</span>
                    <input type="text" id="reg-username" placeholder="Escolha um usuário" required autofocus>
                </div>
            </div>
            <div class="form-group">
                <label for="reg-email">Email (opcional)</label>
                <div class="input-wrap">
                    <span class="input-icon">📧</span>
                    <input type="email" id="reg-email" placeholder="seu@email.com">
                </div>
            </div>
            <div class="form-group">
                <label for="reg-password">Senha</label>
                <div class="input-wrap">
                    <span class="input-icon">🔑</span>
                    <input type="password" id="reg-password" placeholder="Mínimo 6 caracteres" required minlength="6">
                </div>
            </div>
            <button type="submit" class="btn-primary" id="register-btn">Criar conta</button>
        </form>
        <div class="login-footer">
            Já tem conta? <a href="#" onclick="backToLogin(event)">Fazer login</a>
        </div>
    `;
}

async function handleRegister(e) {
    e.preventDefault();
    const username = document.getElementById('reg-username').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;

    if (username.length < 3) { showMessage('Usuário mínimo 3 caracteres', 'error'); return; }
    if (password.length < 6) { showMessage('Senha mínimo 6 caracteres', 'error'); return; }

    const btn = document.getElementById('register-btn');
    const original = btn.innerHTML;
    btn.innerHTML = '<span class="spinner"></span> Criando...';
    btn.disabled = true;

    try {
        const response = await fetch(`${baseUrl}/api/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}&email=${encodeURIComponent(email)}`
        });
        const data = await response.json();

        if (data.success) {
            showMessage('Conta criada! Faça login.', 'success');
            setTimeout(() => backToLogin(), 1200);
        } else {
            showMessage(data.message || 'Erro ao registrar', 'error');
            btn.innerHTML = original;
            btn.disabled = false;
        }
    } catch {
        showMessage('Erro ao conectar', 'error');
        btn.innerHTML = original;
        btn.disabled = false;
    }
}

function backToLogin(e) {
    if (e) e.preventDefault();
    location.reload();
}

// ============================================
// ESQUECEU SENHA
// ============================================
function forgotPassword(e) {
    e.preventDefault();
    showMessage('Recuperação de senha: contate o administrador do sistema.', 'info');
}

// ============================================
// CARREGA USUÁRIO LEMBRADO
// ============================================
const remembered = localStorage.getItem('remember_user');
if (remembered) {
    document.getElementById('username').value = remembered;
    document.getElementById('remember').checked = true;
    document.getElementById('password').focus();
}
</script>
</body>
</html>
