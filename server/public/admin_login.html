<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Chat System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            padding: 20px;
        }
        
        .login-container {
            width: 100%;
            max-width: 420px;
        }
        
        .login-box {
            background: rgba(30, 30, 50, 0.85);
            backdrop-filter: blur(20px);
            padding: 40px 32px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .login-header .icon {
            font-size: 48px;
            margin-bottom: 8px;
        }
        
        .login-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #e0e0e0;
        }
        
        .login-header .subtitle {
            font-size: 14px;
            color: #888;
            margin-top: 4px;
        }
        
        .login-header .badge {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 16px;
            background: rgba(251,191,36,0.15);
            color: #fbbf24;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .form-group {
            margin-bottom: 18px;
        }
        
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #888;
            margin-bottom: 6px;
        }
        
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: #e0e0e0;
            font-size: 15px;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #fbbf24;
            background: rgba(251,191,36,0.08);
            box-shadow: 0 0 0 4px rgba(251,191,36,0.1);
        }
        
        .form-group input::placeholder {
            color: #555;
        }
        
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            border: none;
            border-radius: 12px;
            color: #0f0f0f;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(251,191,36,0.3);
        }
        
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .message {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }
        
        .message.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        
        .message.error {
            background: rgba(248, 113, 113, 0.12);
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.15);
        }
        
        .message.success {
            background: rgba(74, 222, 128, 0.12);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.15);
        }
        
        .message.info {
            background: rgba(251,191,36,0.12);
            color: #fbbf24;
            border: 1px solid rgba(251,191,36,0.15);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(15,15,15,0.1);
            border-radius: 50%;
            border-top-color: #0f0f0f;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        
        .back-link a {
            color: #888;
            text-decoration: none;
            transition: color 0.3s;
        }
        
        .back-link a:hover {
            color: #e0e0e0;
        }
        
        .security-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 12px;
            color: #555;
            margin-top: 16px;
            padding: 8px 16px;
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
        }
        
        .security-info .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
            background: #4ade80;
        }
        
        @media (max-width: 480px) {
            .login-box { padding: 28px 20px; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="icon">👑</div>
                <h1>Painel Administrativo</h1>
                <div class="subtitle">Acesso restrito a administradores</div>
                <div class="badge">🔒 Área Segura</div>
            </div>
            
            <div id="message" class="message"></div>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="username">👤 Usuário</label>
                    <input type="text" id="username" placeholder="Digite seu usuário" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">🔑 Senha</label>
                    <input type="password" id="password" placeholder="Digite sua senha" required>
                </div>
                <button type="submit" class="btn-login" id="login-btn">Entrar no Painel</button>
            </form>
            
            <div class="back-link">
                <a href="/">← Voltar para o início</a>
            </div>
            
            <div class="security-info">
                <span class="dot"></span>
                <span>Conexão segura</span>
                <span>•</span>
                <span>🔐 Autenticação necessária</span>
            </div>
        </div>
    </div>

    <script>
        const host = window.location.hostname;
        const port = '8081';
        const baseUrl = `http://${host}:${port}`;

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message show ${type}`;
            setTimeout(() => { msg.classList.remove('show'); }, 5000);
        }

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                showMessage('Preencha todos os campos', 'error');
                return;
            }

            const btn = document.getElementById('login-btn');
            btn.innerHTML = '<span class="loading-spinner"></span> Entrando...';
            btn.disabled = true;

            try {
                const response = await fetch(`${baseUrl}/admin/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
                });
                
                const data = await response.json();

                if (data.success) {
                    showMessage('✅ Login realizado! Redirecionando...', 'success');
                    setTimeout(() => {
                        window.location.href = `/admin?username=${encodeURIComponent(username)}`;
                    }, 500);
                } else {
                    showMessage(data.message || 'Credenciais inválidas', 'error');
                }
            } catch (error) {
                showMessage('❌ Erro ao conectar ao servidor', 'error');
            }

            btn.innerHTML = 'Entrar no Painel';
            btn.disabled = false;
        });

        // Verificar se já está logado
        async function checkSession() {
            try {
                const response = await fetch(`${baseUrl}/admin/api/verify`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.authenticated) {
                        window.location.href = `/admin?username=${encodeURIComponent(data.username)}`;
                    }
                }
            } catch (error) {
                // Não está logado, manter na página
            }
        }
        checkSession();

        // Enter para submit
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('login-form').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
